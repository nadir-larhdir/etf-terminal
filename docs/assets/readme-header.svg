  <text x="82" y="153"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace"
        font-size="54" font-weight="700" letter-spacing="1.2">
    <tspan fill="#6F7B46">ETF</tspan><tspan fill="#1F271C"> TERMINAL</tspan>
  </text>
  <text x="84" y="184"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace"
