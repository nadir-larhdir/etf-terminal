  </defs>
  <rect width="980" height="250" rx="0" fill="url(#panel)"/>
  <rect width="980" height="250" fill="url(#grid)"/>
  <rect x="54" y="48" width="872" height="154" fill="#FBF8F1" fill-opacity="0.58" stroke="#D8D4C7"/>
  <line x1="54" y1="93" x2="926" y2="93" stroke="#D8D4C7"/>
  <text x="82" y="84"
