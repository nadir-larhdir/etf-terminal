<div class="home-regime-card">
  <div class="home-panel-kicker">Market Regime Indicator</div>
  <div class="home-regime-label" style="color:{{ card.accent }};">{{ card.label }}</div>
  <div class="home-regime-body">{{ card.body }}</div>
  <div class="home-regime-scale">
    <div class="home-regime-scale-bar"></div>
    <div class="home-regime-scale-marker" style="left:calc({{ card.position }}% - 6px);"></div>
  </div>
  <div class="home-regime-legend">
    <span>Risk Off</span>
    <span>Neutral</span>
    <span>Risk On</span>
  </div>
</div>
